<!doctype html>
<html lang="hr">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#28233b">
  <meta name="description" content="Orbit OS — interaktivno učenje strukture, funkcija i mehanizama operacijskog sustava.">
  <link rel="stylesheet" href="local.css"><title>Orbit OS — lokalno učenje operacijskih sustava</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='18' fill='%23817aff'/%3E%3Ccircle cx='32' cy='32' r='15' fill='none' stroke='white' stroke-width='4'/%3E%3Ccircle cx='45' cy='22' r='6' fill='%23ffc9a9'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="style.css"><link rel="stylesheet" href="teaching.css">
  <link rel="stylesheet" href="network.css">
  <link rel="stylesheet" href="recovery.css"><link rel="stylesheet" href="search.css"><link rel="stylesheet" href="explorer.css"><link rel="stylesheet" href="mobile.css"><link rel="stylesheet" href="course.css"><script type="module" src="app.js"></script>
</head>
<body data-theme="dusk">
  <div class="wallpaper" aria-hidden="true"><div class="planet"></div><div class="orbit-line one"></div><div class="orbit-line two"></div><div class="wall-glow"></div><div class="wall-word">orbit<span>Otkrij kako sustav radi.</span></div></div>
  <header class="topbar"><button id="brand" aria-label="Orbit — početna"><span class="brand-symbol">◌</span><strong>orbit<span> OS</span></strong></button><span class="top-divider"></span><span id="active-app">Radna površina</span><div class="top-right"><span class="local-badge"><i></i> Otvaranje lokalnog rada…</span><button id="desktop-toggle" title="Prikaži radnu površinu" aria-label="Prikaži radnu površinu"></button><time id="clock"></time></div></header>
  <main id="desktop" aria-label="Radna površina"><nav id="shortcuts" aria-label="Aplikacije na radnoj površini"></nav><div id="windows"></div><div class="desktop-caption"><span class="tiny-pill">UČENJE OPERACIJSKIH SUSTAVA</span><span>Struktura. Funkcije. Mehanizmi.</span></div></main>
  <div id="launcher" class="launcher" hidden><div class="launcher-heading"><strong>Tvoje aplikacije</strong><span>ORBIT OS · 0.9.0</span></div><label class="search"><span id="search-icon"></span><input id="app-search" placeholder="Pronađi aplikaciju…" aria-label="Pronađi aplikaciju"></label><div id="launcher-grid"></div><div class="launcher-footer"><span class="avatar">U</span><div><strong>Lokalni rad</strong><small>Spremi JSON kroz Moj rad</small></div></div></div>
  <footer class="dock" aria-label="Traka aplikacija"><button class="dock-launch" id="launcher-button" aria-label="Otvori izbornik aplikacija" aria-expanded="false"></button><span class="dock-divider"></span><div id="dock-apps"></div></footer>
  <div id="toast" role="status" aria-live="polite" hidden></div>
  <dialog id="dialog"><form id="dialog-form"><div class="dialog-symbol" id="dialog-icon"></div><h2 id="dialog-title"></h2><p id="dialog-description"></p><label id="dialog-label">Naziv<input id="dialog-input" autocomplete="off" maxlength="100"></label><p id="dialog-error" class="error" role="alert"></p><div class="dialog-actions"><button type="button" class="button secondary" id="dialog-cancel">Odustani</button><button type="submit" class="button primary" id="dialog-submit">Spremi</button></div></form></dialog>
  <noscript>Za Orbit OS potrebno je omogućiti JavaScript u pregledniku.</noscript>
</body></html>
