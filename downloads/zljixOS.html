  function newThreadPlay(initial = 4, lock = "none") {

    } else if (t.step === 1) {

    const lessons = [
      { id: "basics", title: "Datoteka, aplikacija, proces", time: "10–15 min", app: "files", concept: "Datoteka čuva podatke. Aplikacija ih obrađuje. Proces je program koji se izvodi. Minimiziranje mijenja prikaz prozora, a zatvaranje završava proces simulirane aplikacije.", steps: ["U Datotekama otvori Dokumente i izradi mapu Moja_vjezba.", "U toj mapi izradi biljeska.txt. Napiši barem 20 znakova o ulozi OS-a.", "Minimiziraj Bilješke. U Procesima provjeri da su još na popisu, zatim klikni Završi uz Bilješke. Ponovno otvori datoteku."], checks: ["Mapa postoji", "Bilješka sadrži tekst", "Bilješke minimizirane i završene"], question: "Zašto datoteka ostaje dostupna nakon što je proces Bilješke završio?", answer: "Proces je privremen izvođač programa; spremljeni sadržaj datoteke ima trajniji životni vijek. U zljixOS-u je spremljen u lokalne podatke preglednika." },
